name: tests

on:
  push:
  pull_request:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '5.6', laravel: '5.0.*', testbench: '3.0.*', phpunit: '^4.8.35', composer: '2.2' }
          - { php: '5.6', laravel: '5.1.*', testbench: '3.1.*', phpunit: '^5.7', composer: '2.2' }
          - { php: '7.0', laravel: '5.2.*', testbench: '3.2.*', phpunit: '^5.7', composer: '2.2' }
          - { php: '7.0', laravel: '5.3.*', testbench: '3.3.*', phpunit: '^5.7', composer: '2.2' }
          - { php: '7.0', laravel: '5.4.*', testbench: '3.4.*', phpunit: '^5.7', composer: '2.2' }
          - { php: '7.1', laravel: '5.5.*', testbench: '3.5.*', phpunit: '^6.5', composer: '2.2' }
          - { php: '7.1', laravel: '5.6.*', testbench: '3.6.*', phpunit: '^7.5', composer: '2.2' }
          - { php: '7.1', laravel: '5.7.*', testbench: '3.7.*', phpunit: '^7.5', composer: '2.2' }
          - { php: '7.1', laravel: '5.8.*', testbench: '3.8.*', phpunit: '^7.5', composer: '2.2' }
          - { php: '7.2', laravel: '^6.0', testbench: '^4.0', phpunit: '^8.5', composer: '2.2' }
          - { php: '7.2', laravel: '^7.0', testbench: '^5.0', phpunit: '^8.5', composer: '2.2' }
          - { php: '7.4', laravel: '^8.0', testbench: '^6.0', phpunit: '^9.6', composer: '2.2' }
          - { php: '8.0', laravel: '^9.0', testbench: '^7.0', phpunit: '^9.6', composer: '2' }
          - { php: '8.1', laravel: '^10.0', testbench: '^8.0', phpunit: '^10.5', composer: '2' }
          - { php: '8.2', laravel: '^11.0', testbench: '^9.0', phpunit: '^11.5', composer: '2' }
          - { php: '8.3', laravel: '^12.0', testbench: '^10.0', phpunit: '^11.5', composer: '2' }
          - { php: '8.3', laravel: '^13.0', testbench: '^11.0', phpunit: '^12.0', composer: '2' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:${{ matrix.composer }}
          coverage: none
      - run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-update
      - run: composer update --prefer-dist --no-interaction
      - run: composer test
